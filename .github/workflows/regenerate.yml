name: Regenerate

# Keeps the skill in step with the published API surface.
#
# Fired by the docs repository when openapi.json changes on main, the same way
# the SDK repos are. The daily cron is a safety net for a missed dispatch, and
# workflow_dispatch is there for a manual refresh.

on:
  repository_dispatch:
    types: [openapi-updated]
  workflow_dispatch: {}
  schedule:
    # After the SDK regenerations, which run at 04:30 and 04:40 UTC.
    - cron: '45 4 * * *'

concurrency:
  group: regenerate-skill
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate from the published docs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Aborts if the published spec ever starts carrying an endpoint that is
      # meant to stay unpublished, rather than committing it to a public repo.
      - name: Regenerate reference files
        id: regen
        run: python3 scripts/regenerate.py

      - name: Commit if anything changed
        env:
          SUMMARY: ${{ steps.regen.outputs.summary }}
        run: |
          if git diff --quiet -- references; then
            echo "No changes - the skill already matches the published docs."
            exit 0
          fi

          git config user.name "GLofficial"
          git config user.email "190250140+GLofficial@users.noreply.github.com"

          git add references
          git commit \
            -m "Regenerate from the published API docs" \
            -m "Now ${SUMMARY}." \
            -m "Generated by .github/workflows/regenerate.yml from https://docs.smartlyq.com/openapi.json and the public reference pages."
          git push
          echo "Pushed: ${SUMMARY}"
